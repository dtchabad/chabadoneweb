<!-- CYP Simchat Torah - City / State / Zip on one line. Paste BELOW the main block (and below any other CYP add-on). -->
<style>
html.cyp-st #cyp-form-card .form-address-table:has(.form-address-city) > tbody {
  display: grid;
  grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr) minmax(0, 1fr);
  gap: 0 12px;
}
html.cyp-st #cyp-form-card .form-address-table:has(.form-address-city) > tbody > tr:not([style*="none"]) { display: contents; }
html.cyp-st #cyp-form-card .form-address-table:has(.form-address-city) td { padding: 0 0 12px; width: auto !important; }
html.cyp-st #cyp-form-card .form-address-table:has(.form-address-city) td[colspan] { grid-column: 1 / -1; }
@media (max-width: 640px) {
  html.cyp-st #cyp-form-card .form-address-table:has(.form-address-city) > tbody { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  html.cyp-st #cyp-form-card .form-address-table:has(.form-address-city) td:has(.form-address-city) { grid-column: 1 / -1; }
}
</style>
